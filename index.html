<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' ws:; object-src 'none'; base-uri 'self';" />
    <title>PAPLens</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Inter", "Segoe UI", sans-serif;
        background: #09090b;
      }

      body {
        margin: 0;
        background:
          radial-gradient(circle at top, rgba(99, 102, 241, 0.2), transparent 32%),
          radial-gradient(circle at bottom right, rgba(34, 211, 238, 0.14), transparent 28%),
          #09090b;
        color: #ffffff;
      }

      #app-boot-splash {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        z-index: 9999;
        transition: opacity 220ms ease, visibility 220ms ease;
      }

      #app-boot-splash[hidden] {
        display: none;
      }

      #app-boot-splash .boot-card {
        width: min(520px, 100%);
        padding: 36px 32px;
        border-radius: 28px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        background: linear-gradient(180deg, rgba(24, 24, 27, 0.94), rgba(9, 9, 11, 0.88));
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 24px;
        text-align: center;
      }

      #app-boot-splash .boot-spinner {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        border: 4px solid rgba(148, 163, 184, 0.18);
        border-top-color: #3b82f6;
        border-right-color: #2dd4bf;
        animation: boot-spin 0.85s linear infinite;
      }

      #app-boot-splash img {
        width: min(360px, 92%);
        height: auto;
      }

      #app-boot-splash h1 {
        margin: 0 0 10px;
        font-size: clamp(1.7rem, 4vw, 2.2rem);
        letter-spacing: -0.03em;
      }

      #app-boot-splash p {
        margin: 0;
        color: #a1a1aa;
        line-height: 1.6;
      }

      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="app-boot-splash" aria-hidden="true">
      <div class="boot-card">
        <div class="boot-spinner"></div>
        <img src="./Assets/PAPLens Logo Dark.png" alt="PAPLens" />
        <div>
          <h1>Preparing your therapy data</h1>
          <p>Loading therapy history from the local database.</p>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="./src/renderer/main.jsx"></script>
  </body>
</html>
