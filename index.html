<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' ws:; object-src 'none'; base-uri 'self';" />
    <title>PAPLens</title>
    <style>
      /* The splash runs before the app stylesheet loads, so it carries its own
         copy of the base tokens. Keep these in step with styles.css. */
      :root {
        color-scheme: dark;
        font-family: "Segoe UI Variable Text", "Segoe UI", Inter, system-ui, sans-serif;
        background: #0f1216;
      }

      body {
        margin: 0;
        background: #0f1216;
        color: #e9ecef;
      }

      #app-boot-splash {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        z-index: 9999;
        transition: opacity 220ms ease, visibility 220ms ease;
      }

      #app-boot-splash[hidden] {
        display: none;
      }

      #app-boot-splash .boot-card {
        width: min(460px, 100%);
        padding: 40px 32px;
        border-radius: 10px;
        border: 1px solid #282e35;
        background: #161a1f;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 24px;
        text-align: center;
      }

      #app-boot-splash .boot-spinner {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        border: 2px solid #282e35;
        border-top-color: #5c9ddb;
        animation: boot-spin 0.8s linear infinite;
      }

      #app-boot-splash img {
        width: min(280px, 86%);
        height: auto;
      }

      #app-boot-splash h1 {
        margin: 0 0 8px;
        font-size: 1.25rem;
        font-weight: 600;
        letter-spacing: -0.014em;
      }

      #app-boot-splash p {
        margin: 0;
        color: #949ca6;
        font-size: 0.8125rem;
        line-height: 1.5;
      }

      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="app-boot-splash" aria-hidden="true">
      <div class="boot-card">
        <div class="boot-spinner"></div>
        <img src="./Assets/PAPLens Logo Dark.png" alt="PAPLens" />
        <div>
          <h1>Preparing your therapy data</h1>
          <p>Loading therapy history from the local database.</p>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="./src/renderer/main.jsx"></script>
  </body>
</html>
