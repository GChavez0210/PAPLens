name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    # Pinned to windows-2022: windows-latest now resolves to an image whose
    # preinstalled Visual Studio version node-gyp@11 cannot detect, breaking
    # the better-sqlite3 native rebuild.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run check
      - run: npm run audit
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release/*.exe

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run check
      - run: npm run audit
      - run: npm run dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: release-mac
          path: release/*.dmg

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run check
      - run: npm run audit
      - run: npm run dist:linux
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: release/*.AppImage

  publish-release:
    needs: [build-windows, build-mac, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          generate_release_notes: true
